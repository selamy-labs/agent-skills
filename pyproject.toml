[project]
name = "agent-skills"
version = "0.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "scripts", "skills/portfolio-delivery-control/tests"]
addopts = "--strict-markers -q --cov-branch"

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.complexipy]
max-complexity-allowed = 10

[tool.mypy]
explicit_package_bases = true
mypy_path = ["."]

