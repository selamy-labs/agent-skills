name: Diagram Freshness

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diagram-freshness:
    uses: selamy-labs/.github/.github/workflows/diagram-freshness.yml@main
    with:
      source-globs: |
        .claude/**
        .claude-plugin/**
        .github/workflows/**
        skills/**
        tools/**
        scripts/**
        mcp-servers.json
        pyproject.toml
        **/*.spec.md
      enforce: false
